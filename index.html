<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LIFE RPG V4</title>
  <style>
    :root {
      --bg: #07080f;
      --bg2: #0d0f1a;
      --panel: rgba(16, 18, 30, 0.88);
      --panel-border: rgba(120, 140, 255, 0.14);
      --cyan: #22d3ee;
      --violet: #c084fc;
      --gold: #fbbf24;
      --green: #34d399;
      --red: #f87171;
      --pink: #f472b6;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --radius: 16px;
      --radius-sm: 12px;
      --nav-h: 66px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --glow-cyan: 0 0 24px rgba(34, 211, 238, 0.22);
      --glow-violet: 0 0 24px rgba(192, 132, 252, 0.28);
      --glow-gold: 0 0 20px rgba(251, 191, 36, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    body {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 100% 70% at 50% -30%, rgba(34, 211, 238, 0.09), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 100%, rgba(192, 132, 252, 0.07), transparent 50%),
        radial-gradient(ellipse 50% 40% at 0% 80%, rgba(251, 191, 36, 0.03), transparent 40%),
        var(--bg);
    }

    /* ===== NAV ===== */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(10, 11, 18, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--panel-border);
      display: flex;
      z-index: 1000;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: color 0.2s, transform 0.15s;
      padding: 8px 2px;
      min-height: 48px;
    }

    .nav-btn .icon {
      font-size: 22px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .nav-btn.active {
      color: var(--cyan);
    }

    .nav-btn.active .icon {
      transform: scale(1.12);
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.5));
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    /* ===== SCREENS ===== */
    .screens {
      flex: 1;
      overflow: hidden;
      position: relative;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom));
    }

    .screen {
      display: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 24px;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== COMMON UI ===== */
    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-dim);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: border-color 0.2s, box-shadow 0.25s, transform 0.15s;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }

    .card:hover {
      border-color: rgba(34, 211, 238, 0.28);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2), var(--glow-cyan);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      min-height: 46px;
      letter-spacing: 0.2px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c4e0, #7c3aed);
      color: #fff;
      box-shadow: 0 4px 20px rgba(0, 196, 224, 0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 28px rgba(0, 196, 224, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--panel-border);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-success {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .btn-gold {
      background: linear-gradient(135deg, #b45309, #d97706);
      color: #fff;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 0.82rem;
      min-height: 38px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .btn-block {
      width: 100%;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
    }

    .empty-state .big-icon {
      font-size: 3.2rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 0.9rem;
      max-width: 280px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    /* Progress bar */
    .progress-wrap {
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    .progress-bar.gold {
      background: linear-gradient(90deg, #f59e0b, var(--gold));
      box-shadow: var(--glow-gold);
    }

    .progress-bar.green {
      background: linear-gradient(90deg, #16a34a, var(--green));
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .badge-side { background: rgba(0, 229, 255, 0.15); color: var(--cyan); }
    .badge-main { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .badge-boss { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-diff { background: rgba(255, 215, 0, 0.12); color: var(--gold); }
    .badge-done { background: rgba(34, 197, 94, 0.18); color: var(--green); }

    /* ===== HERO SCREEN ===== */
    .hero-card {
      text-align: center;
      padding: 28px 20px;
      background: linear-gradient(160deg, rgba(0, 229, 255, 0.08), rgba(168, 85, 247, 0.08));
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(0, 229, 255, 0.06), transparent 50%);
      pointer-events: none;
    }

    .hero-name {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .hero-lvl {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
    }

    .hero-xp {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin: 8px 0 4px;
    }

    .hero-xp span {
      color: var(--gold);
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      text-align: center;
    }

    .stat-box .val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .stat-box .lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== QUESTS ===== */
    .quest-card {
      position: relative;
    }

    .quest-card.done {
      opacity: 0.65;
    }

    .quest-card.done .quest-title {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .quest-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .quest-title {
      font-size: 1.05rem;
      font-weight: 700;
      flex: 1;
      line-height: 1.3;
    }

    .quest-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .quest-desc {
      font-size: 0.88rem;
      color: var(--text-dim);
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .quest-target {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quest-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quest-xp {
      font-weight: 800;
      color: var(--gold);
      font-size: 0.95rem;
    }

    /* ===== DIRECTIONS / SKILLS ===== */
    .dir-card {
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .dir-card:active {
      transform: scale(0.98);
    }

    .dir-card:hover {
      border-color: rgba(0, 229, 255, 0.4);
      box-shadow: var(--glow-cyan);
    }

    .dir-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .dir-name {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .dir-lvl {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--gold);
      background: rgba(255, 215, 0, 0.1);
      padding: 3px 10px;
      border-radius: 8px;
    }

    .dir-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Skill Tree View */
    .tree-view {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      background: var(--bg);
      flex-direction: column;
    }

    .tree-view.open {
      display: flex;
    }

    .tree-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(10, 11, 18, 0.95);
      flex-shrink: 0;
    }

    .tree-header h2 {
      font-size: 1.15rem;
      font-weight: 800;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-controls {
      display: flex;
      gap: 6px;
    }

    .tree-canvas-wrap {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.03), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.03), transparent 40%),
        var(--bg2);
    }

    .tree-canvas {
      position: relative;
      min-width: 100%;
      min-height: 100%;
      transform-origin: 0 0;
    }

    .tree-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: visible;
    }

    .skill-node {
      position: absolute;
      width: 150px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      z-index: 2;
      user-select: none;
    }

    .skill-node:hover {
      border-color: rgba(0, 229, 255, 0.5);
      box-shadow: var(--glow-cyan);
      z-index: 3;
    }

    .skill-node.root {
      border-color: rgba(168, 85, 247, 0.4);
      background: linear-gradient(160deg, rgba(168, 85, 247, 0.12), rgba(18, 20, 32, 0.95));
    }

    .skill-node .sn-name {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skill-node .sn-lvl {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
    }

    .skill-node .sn-xp {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .skill-node .sn-bar {
      height: 4px;
      margin: 6px 0 8px;
    }

    .skill-node .sn-actions {
      display: flex;
      gap: 4px;
      opacity: 0.85;
    }

    .skill-node .sn-actions button {
      flex: 1;
      font-size: 0.7rem;
      padding: 5px 4px;
      min-height: 30px;
    }

    /* ===== LORE ===== */
    .lore-card .lore-date {
      font-size: 0.78rem;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .lore-card .lore-text {
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* ===== SAVE ===== */
    .save-section {
      margin-bottom: 24px;
    }

    .save-section h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: var(--text-dim);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--panel-border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 20px calc(24px + var(--safe-bottom));
      animation: slideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
      .modal {
        border-radius: 20px;
        max-height: 85vh;
      }
    }

    .modal h2 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      min-height: 46px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .xp-preview {
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      text-align: center;
      margin-bottom: 16px;
    }

    .xp-preview .val {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold);
    }

    .xp-preview .lbl {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: min(340px, calc(100% - 32px));
    }

    .toast {
      background: rgba(18, 20, 32, 0.96);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), var(--glow-cyan);
      animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(12px);
    }

    .toast.levelup {
      border-color: rgba(255, 215, 0, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), var(--glow-gold);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(18, 20, 32, 0.96));
    }

    .toast.success {
      border-color: rgba(34, 197, 94, 0.4);
    }

    .toast.error {
      border-color: rgba(239, 68, 68, 0.4);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-12px) scale(0.95); }
    }

    /* Level up overlay */
    .levelup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 2500;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .levelup-overlay.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .levelup-overlay .lu-text {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 0.8s ease infinite alternate;
    }

    .levelup-overlay .lu-sub {
      font-size: 1.3rem;
      color: var(--text);
      margin-top: 8px;
      white-space: pre-line;
      text-align: center;
    }

    @keyframes pulse {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.06); filter: brightness(1.2); }
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 99px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 38px;
    }

  <!-- MODAL -->

    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    // ===================== CONSTANTS & XP =====================
    const STORAGE_KEY = 'life_rpg_v4';
    const MAX_LEVEL = 200;

    const QUEST_XP = {
      SIDE:  { 1: 20,  2: 50,  3: 120, 4: 280,  5: 650  },
      MAIN:  { 1: 80,  2: 180, 3: 400, 4: 800,  5: 1600 },
      BOSS:  { 1: 250, 2: 600, 3: 1200,4: 2500, 5: 5000 }
    };

    const DIFF_LABELS = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV', 5: 'V' };

    // ===== TITLES (Identity) =====
    const TITLES = [
      { id: 'newbie', name: 'Новичок', desc: 'Только начинает путь', minLevel: 1 },
      { id: 'seeker', name: 'Искатель', desc: 'Уже ищет свой путь', minLevel: 5 },
      { id: 'doer', name: 'Делатель', desc: 'Превращает намерения в действия', minLevel: 10 },
      { id: 'persistent', name: 'Упорный', desc: 'Не бросает начатое', minLevel: 20 },
      { id: 'adept', name: 'Адепт', desc: 'Серьёзно относится к развитию', minLevel: 35 },
      { id: 'master', name: 'Мастер', desc: 'Достиг значительных высот', minLevel: 50 },
      { id: 'legend', name: 'Легенда', desc: 'Живая легенда собственной жизни', minLevel: 75 },
      { id: 'myth', name: 'Миф', desc: 'То, о чём будут рассказывать', minLevel: 100 },
      { id: 'immortal', name: 'Бессмертный', desc: 'LVL 150+', minLevel: 150 },
      { id: 'transcendent', name: 'Превосходящий', desc: 'LVL 200 — потолок пробит', minLevel: 200 },
      // Action-based
      { id: 'boss_slayer', name: 'Убийца боссов', desc: 'Победил первого BOSS', condition: 'boss1' },
      { id: 'boss_hunter', name: 'Охотник на боссов', desc: '5 BOSS повержено', condition: 'boss5' },
      { id: 'quest_100', name: 'Сотня квестов', desc: 'Выполнил 100 квестов', condition: 'quests100' },
      { id: 'streak_7', name: 'Неделя силы', desc: 'Серия 7 дней', condition: 'streak7' },
      { id: 'streak_30', name: 'Месяц дисциплины', desc: 'Серия 30 дней', condition: 'streak30' },
      { id: 'deep_tree', name: 'Архитектор навыков', desc: 'Дерево глубиной 5+', condition: 'depth5' },
      { id: 'polymath', name: 'Полимат', desc: '5+ направлений', condition: 'dirs5' },
    ];

    // ===== ACHIEVEMENTS =====
    const ACHIEVEMENTS = [
      { id: 'first_quest', name: 'Первый шаг', desc: 'Выполнил первый квест', icon: '👣', hidden: false },
      { id: 'first_boss', name: 'Первая кровь', desc: 'Победил первого BOSS', icon: '☠', hidden: false },
      { id: 'first_dir', name: 'Выбор пути', desc: 'Создал первое направление', icon: '🌳', hidden: false },
      { id: 'first_skill', name: 'Зерно мастерства', desc: 'Создал первый навык', icon: '🌱', hidden: false },
      { id: 'level_10', name: 'Двузначный', desc: 'Достиг LVL 10', icon: '🔟', hidden: false },
      { id: 'level_25', name: 'Четверть пути', desc: 'Достиг LVL 25', icon: '⭐', hidden: false },
      { id: 'level_50', name: 'Полтинник', desc: 'Достиг LVL 50', icon: '💎', hidden: false },
      { id: 'level_100', name: 'Сотня', desc: 'Достиг LVL 100', icon: '👑', hidden: false },
      { id: 'quests_10', name: 'Десятка', desc: '10 выполненных квестов', icon: '📜', hidden: false },
      { id: 'quests_50', name: 'Полтинник квестов', desc: '50 выполненных квестов', icon: '🔥', hidden: false },
      { id: 'quests_100', name: 'Легенда квестов', desc: '100 выполненных квестов', icon: '🏆', hidden: false },
      { id: 'boss_3', name: 'Тройной удар', desc: '3 BOSS повержено', icon: '⚔', hidden: false },
      { id: 'boss_10', name: 'Коллекционер голов', desc: '10 BOSS повержено', icon: '💀', hidden: true },
      { id: 'streak_3', name: 'Три дня подряд', desc: 'Серия 3 дня', icon: '🔥', hidden: false },
      { id: 'streak_7', name: 'Неделя без пропусков', desc: 'Серия 7 дней', icon: '📅', hidden: false },
      { id: 'streak_30', name: 'Месяц силы', desc: 'Серия 30 дней', icon: '🏔', hidden: true },
      { id: 'deep_5', name: 'Глубина', desc: 'Ветка навыков глубиной 5+', icon: '🕳', hidden: false },
      { id: 'dirs_3', name: 'Три пути', desc: '3 направления', icon: '🗺', hidden: false },
      { id: 'luck', name: 'Везунчик', desc: 'Получил бонус удачи', icon: '🍀', hidden: true },
      { id: 'reflector', name: 'Рефлектор', desc: 'Написал первое отражение', icon: '🪞', hidden: false },
      { id: 'lore_10', name: 'Летописец', desc: '10 записей в лоре', icon: '📖', hidden: false },
    ];

    // Non-linear XP curve: total XP required to REACH level L
    // XP(level) cumulative ≈ 300 * (L-1)^2.38
    function xpForLevel(level) {
      if (level <= 1) return 0;
      if (level > MAX_LEVEL) level = MAX_LEVEL;
      return Math.floor(300 * Math.pow(level - 1, 2.38));
    }

    function levelFromXp(xp) {
      let lvl = 1;
      while (lvl < MAX_LEVEL && xpForLevel(lvl + 1) <= xp) {
        lvl++;
      }
      return lvl;
    }

    function xpProgress(xp) {
      const lvl = levelFromXp(xp);
      if (lvl >= MAX_LEVEL) return { level: MAX_LEVEL, current: 0, needed: 0, percent: 100 };
      const curBase = xpForLevel(lvl);
      const nextBase = xpForLevel(lvl + 1);
      const into = xp - curBase;
      const need = nextBase - curBase;
      return {
        level: lvl,
        current: into,
        needed: need,
        percent: need > 0 ? Math.min(100, (into / need) * 100) : 100
      };
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    // ===================== STATE =====================
    let state = {
      hero: { name: 'Безымянный герой', xp: 0, titleId: 'newbie' },
      directions: [],
      quests: [],
      lore: [],
      stats: { completed: 0, totalXp: 0 },
      streak: { current: 0, longest: 0, lastDate: null },
      unlockedTitles: ['newbie'],
      unlockedAchievements: [],
      reflections: []
    };

    let currentTreeDirId = null;
    let treeScale = 1;
    let questFilter = 'all';
    let editingId = null;
    let editingType = null;
    let skillParentId = null;
    let pendingReflectionQuest = null;

    // ===================== PERSISTENCE =====================
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Save failed', e);
        toast('Ошибка сохранения', 'error');
      }
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data && data.hero) {
            state = {
              hero: Object.assign({ name: 'Безымянный герой', xp: 0, titleId: 'newbie' }, data.hero),
              directions: Array.isArray(data.directions) ? data.directions : [],
              quests: Array.isArray(data.quests) ? data.quests : [],
              lore: Array.isArray(data.lore) ? data.lore : [],
              stats: data.stats || { completed: 0, totalXp: 0 },
              streak: data.streak || { current: 0, longest: 0, lastDate: null },
              unlockedTitles: Array.isArray(data.unlockedTitles) ? data.unlockedTitles : ['newbie'],
              unlockedAchievements: Array.isArray(data.unlockedAchievements) ? data.unlockedAchievements : [],
              reflections: Array.isArray(data.reflections) ? data.reflections : []
            };
            state.directions.forEach(d => {
              d.xp = d.xp || 0;
              (d.nodes || []).forEach(n => { n.xp = n.xp || 0; });
            });
          }
        }
      } catch (e) {
        console.warn('Load failed', e);
      }
    }

    // ===================== TOASTS & LEVEL UP =====================
    function toast(msg, type = '') {
      const el = document.createElement('div');
      el.className = 'toast' + (type ? ' ' + type : '');
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => {
        el.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    function showLevelUp(from, to) {
      const ov = document.getElementById('levelupOverlay');
      const isMilestone = [10, 25, 50, 75, 100, 150, 200].includes(to);
      document.getElementById('levelupSub').textContent = isMilestone
        ? `⭐ ГЛАВА ${to} ⭐\nLVL ${from} → LVL ${to}`
        : `LVL ${from} → LVL ${to}`;
      ov.classList.add('show');
      setTimeout(() => ov.classList.remove('show'), isMilestone ? 3200 : 2200);
      addAutoLore(isMilestone
        ? `⭐ ГЛАВА ЗАВЕРШЕНА! Достигнут легендарный LVL ${to}`
        : `⚔️ LEVEL UP! Достигнут LVL ${to}`);
      checkTitlesAndAchievements();
    }

    function addAutoLore(text) {
      if (!text || !text.trim()) return;
      const today = new Date().toLocaleDateString('ru-RU');
      state.lore.push({
        id: uid(),
        date: today,
        text: text.trim(),
        createdAt: Date.now(),
        auto: true
      });
      if (state.lore.length > 400) state.lore = state.lore.slice(-400);
    }

    // ===================== PSYCHOLOGICAL SYSTEMS =====================
    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function updateStreak() {
      const today = todayStr();
      const s = state.streak;
      if (s.lastDate === today) return; // already counted today
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yStr = yesterday.toISOString().slice(0, 10);
      if (s.lastDate === yStr) {
        s.current += 1;
      } else {
        s.current = 1;
      }
      s.lastDate = today;
      if (s.current > s.longest) s.longest = s.current;
    }

    function getTitle(id) {
      return TITLES.find(t => t.id === id) || TITLES[0];
    }

    function checkTitlesAndAchievements() {
      const lvl = levelFromXp(state.hero.xp);
      const completed = state.quests.filter(q => q.done).length;
      const bosses = state.quests.filter(q => q.done && q.type === 'BOSS').length;
      const dirs = state.directions.length;
      let maxDepth = 0;
      state.directions.forEach(d => {
        const depth = calcMaxDepth(d.nodes || []);
        if (depth > maxDepth) maxDepth = depth;
      });

      // Unlock level-based titles
      TITLES.forEach(t => {
        if (t.minLevel && lvl >= t.minLevel && !state.unlockedTitles.includes(t.id)) {
          state.unlockedTitles.push(t.id);
          toast(`🎖 Новый титул: ${t.name}`, 'levelup');
          addAutoLore(`🎖 Получен титул «${t.name}» — ${t.desc}`);
        }
      });

      // Condition titles
      const condMap = {
        boss1: bosses >= 1,
        boss5: bosses >= 5,
        quests100: completed >= 100,
        streak7: state.streak.current >= 7 || state.streak.longest >= 7,
        streak30: state.streak.longest >= 30,
        depth5: maxDepth >= 5,
        dirs5: dirs >= 5
      };
      TITLES.forEach(t => {
        if (t.condition && condMap[t.condition] && !state.unlockedTitles.includes(t.id)) {
          state.unlockedTitles.push(t.id);
          toast(`🎖 Новый титул: ${t.name}`, 'levelup');
          addAutoLore(`🎖 Получен титул «${t.name}» — ${t.desc}`);
        }
      });

      // Achievements
      const checks = {
        first_quest: completed >= 1,
        first_boss: bosses >= 1,
        first_dir: dirs >= 1,
        first_skill: state.directions.some(d => (d.nodes || []).length > 0),
        level_10: lvl >= 10,
        level_25: lvl >= 25,
        level_50: lvl >= 50,
        level_100: lvl >= 100,
        quests_10: completed >= 10,
        quests_50: completed >= 50,
        quests_100: completed >= 100,
        boss_3: bosses >= 3,
        boss_10: bosses >= 10,
        streak_3: state.streak.longest >= 3,
        streak_7: state.streak.longest >= 7,
        streak_30: state.streak.longest >= 30,
        deep_5: maxDepth >= 5,
        dirs_3: dirs >= 3,
        lore_10: state.lore.length >= 10,
        reflector: state.reflections.length >= 1
      };

      ACHIEVEMENTS.forEach(a => {
        if (checks[a.id] && !state.unlockedAchievements.includes(a.id)) {
          state.unlockedAchievements.push(a.id);
          toast(`${a.icon} Достижение: ${a.name}`, 'levelup');
          addAutoLore(`${a.icon} Достижение разблокировано: «${a.name}» — ${a.desc}`);
        }
      });
    }

    function calcMaxDepth(nodes, parentId = null, depth = 1) {
      const children = nodes.filter(n => (n.parentId || null) === parentId);
      if (children.length === 0) return depth - 1;
      return Math.max(...children.map(c => calcMaxDepth(nodes, c.id, depth + 1)));
    }

    function tryLuckBonus(baseXp) {
      // 18% chance of bonus
      if (Math.random() < 0.18) {
        const mult = 1.15 + Math.random() * 0.2; // 15-35%
        const bonus = Math.floor(baseXp * (mult - 1));
        if (bonus > 0) {
          if (!state.unlockedAchievements.includes('luck')) {
            state.unlockedAchievements.push('luck');
            toast('🍀 Достижение: Везунчик', 'levelup');
          }
          return { total: baseXp + bonus, bonus, mult };
        }
      }
      return { total: baseXp, bonus: 0, mult: 1 };
    }

    function applyXp(amount, targetType, targetId, opts = {}) {
      if (amount <= 0) return;

      const oldHeroLvl = levelFromXp(state.hero.xp);
      state.hero.xp += amount;
      state.stats.totalXp = (state.stats.totalXp || 0) + amount;
      const newHeroLvl = levelFromXp(state.hero.xp);

      if (newHeroLvl > oldHeroLvl) {
        showLevelUp(oldHeroLvl, newHeroLvl);
      } else if (!opts.silent) {
        const bonusNote = opts.bonus ? ` (🍀 +${opts.bonus} удача!)` : '';
        toast(`+${amount} XP${bonusNote}`, 'success');
      }

      if (targetType === 'DIRECTION' && targetId) {
        const dir = state.directions.find(d => d.id === targetId);
        if (dir) {
          const old = levelFromXp(dir.xp);
          dir.xp += amount;
          const neu = levelFromXp(dir.xp);
          if (neu > old) toast(`${dir.name}: LVL ${neu}!`, 'levelup');
        }
      } else if (targetType === 'SKILL' && targetId) {
        for (const dir of state.directions) {
          const node = (dir.nodes || []).find(n => n.id === targetId);
          if (node) {
            const oldN = levelFromXp(node.xp);
            node.xp += amount;
            const neuN = levelFromXp(node.xp);
            if (neuN > oldN) toast(`${node.name}: LVL ${neuN}!`, 'levelup');
            const oldD = levelFromXp(dir.xp);
            dir.xp += amount;
            const neuD = levelFromXp(dir.xp);
            if (neuD > oldD) toast(`${dir.name}: LVL ${neuD}!`, 'levelup');
            break;
          }
        }
      }

      checkTitlesAndAchievements();
      save();
    }

              ${q.done ? '<span class="badge badge-done">✓ Выполнен</span>' : ''}
            </div>
            ${q.description ? `<div class="quest-desc">${escapeHtml(q.description)}</div>` : ''}
            ${targetLabel ? `<div class="quest-target">🎯 ${escapeHtml(targetLabel)}</div>` : ''}
            <div class="quest-actions">
              ${!q.done ? `<button class="btn btn-success btn-sm" onclick="completeQuest('${q.id}')">✓ Выполнить</button>` : ''}
              ${!q.done ? `<button class="btn btn-secondary btn-sm" onclick="openQuestModal('${q.id}')">✎</button>` : ''}
              <button class="btn btn-danger btn-sm" onclick="deleteQuest('${q.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getQuestTargetLabel(q) {
      if (q.targetType === 'GENERAL' || !q.targetId) return null;
      if (q.targetType === 'DIRECTION') {
        const d = state.directions.find(x => x.id === q.targetId);
        return d ? `Направление: ${d.name}` : 'Направление (удалено)';
      }
      if (q.targetType === 'SKILL') {
        for (const d of state.directions) {
          const n = (d.nodes || []).find(x => x.id === q.targetId);
          if (n) return `Навык: ${n.name} (${d.name})`;
        }
        return 'Навык (удалён)';
      }
      return null;
    }

    function updateXpPreview() {
      const type = document.getElementById('qType')?.value || 'SIDE';
      const diff = parseInt(document.getElementById('qDiff')?.value || 3, 10);
      const xp = QUEST_XP[type]?.[diff] || 0;
      const el = document.getElementById('xpPreviewVal');
      if (el) el.textContent = `+${xp} XP`;
    }

    function saveQuest() {
      const title = document.getElementById('qTitle').value.trim();
      if (!title) { toast('Введи название', 'error'); return; }

      const type = document.getElementById('qType').value;
      const difficulty = parseInt(document.getElementById('qDiff').value, 10);
      const description = document.getElementById('qDesc').value.trim();
      const targetRaw = document.getElementById('qTarget').value;
      const xp = QUEST_XP[type][difficulty];

      let targetType = 'GENERAL';
      let targetId = null;
      if (targetRaw.startsWith('dir:')) {
        targetType = 'DIRECTION';
        targetId = targetRaw.slice(4);
      } else if (targetRaw.startsWith('skill:')) {
        targetType = 'SKILL';
        targetId = targetRaw.slice(6);
      }

      if (editingId) {
        const q = state.quests.find(x => x.id === editingId);
        if (q && !q.done) {
          q.title = title;
          q.type = type;
          q.difficulty = difficulty;
          q.xp = xp;
          q.description = description;
          q.targetType = targetType;
          q.targetId = targetId;
          toast('Квест обновлён');
        }
      } else {
        state.quests.push({
          id: uid(),
          title,
          type,
          difficulty,
          xp,
          description,
          targetType,
          targetId,
          done: false,
          createdAt: Date.now()
        });
        toast('Квест создан');
      }
      save();
      closeModal();
      renderQuests();
      renderHero();
    }

    function completeQuest(id) {
      const q = state.quests.find(x => x.id === id);
      if (!q || q.done) return;

      q.done = true;
      q.completedAt = Date.now();
      state.stats.completed = (state.stats.completed || 0) + 1;

      // Streak
      updateStreak();

      // Variable reward (luck)
      const luck = tryLuckBonus(q.xp);
      const finalXp = luck.total;

      applyXp(finalXp, q.targetType, q.targetId, { bonus: luck.bonus });

      // Auto-lore
      const targetLabel = getQuestTargetLabel(q);
      let loreText = '';
      if (q.type === 'BOSS') {
        loreText = `☠ BOSS повержен: «${q.title}» (+${finalXp} XP${luck.bonus ? ', 🍀 удача!' : ''})`;
        toast('☠ BOSS повержен!', 'levelup');
      } else if (q.type === 'MAIN') {
        loreText = `📜 Главный квест выполнен: «${q.title}» (+${finalXp} XP${luck.bonus ? ', 🍀 удача!' : ''})`;
      } else {
        loreText = `✓ Квест выполнен: «${q.title}» (+${finalXp} XP${luck.bonus ? ', 🍀 удача!' : ''})`;
      }
      if (targetLabel) loreText += `\n🎯 ${targetLabel}`;
      if (state.streak.current > 1) loreText += `\n🔥 Серия: ${state.streak.current} дн.`;
      addAutoLore(loreText);

      checkTitlesAndAchievements();
      save();
      renderQuests();
      renderHero();
      if (currentTreeDirId) renderTree(currentTreeDirId);
      renderDirections();

      // Reflection ritual for MAIN and BOSS
      if (q.type === 'MAIN' || q.type === 'BOSS') {
        setTimeout(() => openReflectionModal(q), 600);
      }
    }

    function deleteDirection(id) {
      if (!confirm('Удалить направление и всё его дерево навыков?\nПривязанные квесты станут «Общий XP».')) return;

      // Unlink quests
      state.quests.forEach(q => {

    // ===================== SKILL TREE =====================
    function openTreeView(dirId) {
      currentTreeDirId = dirId;
      treeScale = 1;
      const dir = state.directions.find(d => d.id === dirId);
      if (!dir) return;
      document.getElementById('treeTitle').textContent = dir.name;

    function treeZoom(delta) {
      treeScale = Math.max(0.4, Math.min(1.8, treeScale + delta));
      const canvas = document.getElementById('treeCanvas');
      canvas.style.transform = `scale(${treeScale})`;
    }

    function renderTree(dirId) {
      const dir = state.directions.find(d => d.id === dirId);
      if (!dir) return;
      const nodes = dir.nodes || [];
      const canvas = document.getElementById('treeCanvas');
      const wrap = document.getElementById('treeCanvasWrap');

      // Build tree structure
      const byParent = {};
      nodes.forEach(n => {
        const p = n.parentId || 'root';
        if (!byParent[p]) byParent[p] = [];
        byParent[p].push(n);
      });

      // Layout: recursive, depth-based
      const NODE_W = 150;
      const NODE_H = 110;
      const H_GAP = 40;
      const V_GAP = 70;
      const positions = {};
      let maxX = 0;
      let maxY = 0;

      function layout(parentId, depth, startX) {
        const children = byParent[parentId] || [];
        if (children.length === 0) return startX;

        let x = startX;
        children.forEach((child, i) => {
          const subtreeWidth = measureWidth(child.id);
          const cx = x + subtreeWidth / 2 - NODE_W / 2;
          const cy = 40 + depth * (NODE_H + V_GAP);
          positions[child.id] = { x: Math.max(20, cx), y: cy, node: child };
          maxX = Math.max(maxX, positions[child.id].x + NODE_W + 40);
          maxY = Math.max(maxY, cy + NODE_H + 40);
          layout(child.id, depth + 1, x);
          x += subtreeWidth + H_GAP;
        });
        return x;
      }

      function measureWidth(nodeId) {
        const children = byParent[nodeId] || [];
        if (children.length === 0) return NODE_W;
        let w = 0;
        children.forEach((c, i) => {
          w += measureWidth(c.id);
          if (i < children.length - 1) w += H_GAP;
        });
        return Math.max(NODE_W, w);
      }

      // Roots
      const roots = byParent['root'] || [];
      let startX = 40;
      roots.forEach((r, i) => {
        const w = measureWidth(r.id);
        const cx = startX + w / 2 - NODE_W / 2;
        const cy = 40;
        positions[r.id] = { x: Math.max(20, cx), y: cy, node: r };
        maxX = Math.max(maxX, positions[r.id].x + NODE_W + 40);
        maxY = Math.max(maxY, cy + NODE_H + 40);
        layout(r.id, 1, startX);
        startX += w + H_GAP + 30;
      });

      if (roots.length === 0) {
        canvas.innerHTML = `
          <div style="padding:48px 20px;text-align:center;color:var(--text-dim);max-width:320px;margin:0 auto">
            <div style="font-size:2.5rem;margin-bottom:12px;opacity:0.5">🌳</div>
            <p style="font-weight:700;color:var(--text);margin-bottom:8px">Дерево пустое</p>
            <p style="font-size:0.85rem;margin-bottom:14px">Нажми «+ Корень» — это будет большой столп направления (например «Аккорды» или «Сила»).</p>
            <div class="tip-box" style="text-align:left">
              <strong>Как думать:</strong><br>
              Корень → 2–4 столпа → углубление в то, что реально качаешь.
            </div>
            <button class="btn btn-secondary btn-sm" onclick="showTreeExamples()">Смотреть примеры</button>
          </div>`;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.transform = `scale(${treeScale})`;
        return;
      }

      const canvasW = Math.max(maxX + 60, wrap.clientWidth / treeScale);
      const canvasH = Math.max(maxY + 80, wrap.clientHeight / treeScale);
      canvas.style.width = canvasW + 'px';
      canvas.style.height = canvasH + 'px';
      canvas.style.transform = `scale(${treeScale})`;

      // SVG lines
      let svgLines = '';
      nodes.forEach(n => {
        if (n.parentId && positions[n.parentId] && positions[n.id]) {
          const p = positions[n.parentId];
          const c = positions[n.id];
          const x1 = p.x + NODE_W / 2;
          const y1 = p.y + NODE_H - 8;
          const x2 = c.x + NODE_W / 2;
          const y2 = c.y + 4;
          const midY = (y1 + y2) / 2;
          svgLines += `<path d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" fill="none" stroke="rgba(0,229,255,0.35)" stroke-width="2"/>`;
        }
      });

      let html = `<svg class="tree-svg" width="${canvasW}" height="${canvasH}">${svgLines}</svg>`;

      Object.values(positions).forEach(({ x, y, node }) => {
        const prog = xpProgress(node.xp || 0);
        const isRoot = !node.parentId;
        const isKey = !!node.isKey;
        const near = prog.percent >= 85 && prog.level < MAX_LEVEL;
        html += `
          <div class="skill-node ${isRoot ? 'root' : ''} ${isKey ? 'key-skill' : ''}" style="left:${x}px;top:${y}px" data-id="${node.id}">
            <div class="sn-name">${escapeHtml(node.name)}</div>
            <div class="sn-lvl">LVL ${prog.level}${near ? ' ⚡' : ''}</div>
            <div class="sn-xp">${formatNum(node.xp || 0)} XP</div>
            <div class="progress-wrap sn-bar">
              <div class="progress-bar ${near ? 'gold' : ''}" style="width:${prog.percent}%"></div>
            </div>
            <div class="sn-actions">
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openSkillModal('${node.id}', true)">+</button>
              <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();toggleKeySkill('${node.id}')" title="Ключевой">${isKey ? '★' : '☆'}</button>
              <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openSkillModal('${node.id}')">✎</button>
              <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteSkill('${node.id}')">✕</button>
            </div>
          </div>`;
      });

      canvas.innerHTML = html;
    }

    function openSkillModal(id, asChild) {
      const dir = state.directions.find(d => d.id === currentTreeDirId);
      if (!dir) return;

      skillParentId = null;
      editingId = null;
      editingType = 'skill';

      let node = null;
      if (asChild && id) {
        // adding child of id
        skillParentId = id;
      } else if (id) {
        // editing existing
        editingId = id;
        node = (dir.nodes || []).find(n => n.id === id);
      }
      // else: new root

      const title = node ? 'Редактировать навык' : (skillParentId ? 'Новая ветка' : 'Корневой навык');

      document.getElementById('modalContent').innerHTML = `
        <h2>${title}</h2>
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="sName" value="${node ? escapeHtml(node.name) : ''}" placeholder="Название навыка" maxlength="60">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="sDesc" placeholder="Что это за навык?">${node ? escapeHtml(node.description || '') : ''}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
          <button class="btn btn-primary" onclick="saveSkill()">${node ? 'Сохранить' : 'Создать'}</button>
        </div>
      `;
      openModal();
    }

    function saveSkill() {
      const dir = state.directions.find(d => d.id === currentTreeDirId);
      if (!dir) return;
      if (!dir.nodes) dir.nodes = [];

      const name = document.getElementById('sName').value.trim();
      if (!name) { toast('Введи название', 'error'); return; }
      const description = document.getElementById('sDesc').value.trim();

      if (editingId) {
        const node = dir.nodes.find(n => n.id === editingId);
        if (node) {
          node.name = name;
          node.description = description;
          toast('Навык обновлён');
        }
      } else {
        dir.nodes.push({
          id: uid(),
          name,
          description,
          parentId: skillParentId || null,
          xp: 0
        });
        if (!skillParentId) {
          addAutoLore(`🌱 Новый навык: «${name}» в направлении «${dir.name}»`);
        }
        toast(skillParentId ? 'Ветка создана' : 'Корневой навык создан');
        checkTitlesAndAchievements();
      }

      save();
      closeModal();
      renderTree(currentTreeDirId);
      renderHero();
    }

    function deleteSkill(id) {
      const dir = state.directions.find(d => d.id === currentTreeDirId);
      if (!dir) return;
      if (!confirm('Удалить навык и все его дочерние ветки?\nПривязанные квесты станут «Общий XP».')) return;

      // Collect all descendant ids
      const toDelete = new Set();
      function collect(nid) {
        toDelete.add(nid);
        (dir.nodes || []).filter(n => n.parentId === nid).forEach(c => collect(c.id));
      }
      collect(id);

      // Unlink quests
      state.quests.forEach(q => {
        if (q.targetType === 'SKILL' && toDelete.has(q.targetId)) {
          q.targetType = 'GENERAL';
          q.targetId = null;
        }
      });

      dir.nodes = (dir.nodes || []).filter(n => !toDelete.has(n.id));
      save();
      renderTree(currentTreeDirId);
      renderHero();
      renderQuests();
      toast('Навык удалён');
    }

    // ===================== LORE =====================
    function renderLore() {
      const list = document.getElementById('loreList');
      const items = [...state.lore].reverse();

      if (items.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="big-icon">📖</div>
            <h3>История пуста</h3>
            <p>Лор пишется автоматически при выполнении квестов и level-up. Можно добавлять записи вручную.</p>
            <button class="btn btn-primary" onclick="openLoreModal()">+ Первая запись</button>
          </div>`;
        return;
      }

      list.innerHTML = items.map(l => `
        <div class="card lore-card">
          <div class="lore-date">
            ${escapeHtml(l.date)}
            ${l.auto ? '<span class="badge" style="margin-left:8px;background:rgba(0,229,255,0.12);color:var(--cyan);font-size:0.65rem">АВТО</span>' : ''}
          </div>
          <div class="lore-text">${escapeHtml(l.text)}</div>
          <div class="quest-actions mt-12">
            <button class="btn btn-secondary btn-sm" onclick="openLoreModal('${l.id}')">✎</button>
            <button class="btn btn-danger btn-sm" onclick="deleteLore('${l.id}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    function openLoreModal(id) {
      editingId = id || null;
      editingType = 'lore';
      const l = id ? state.lore.find(x => x.id === id) : null;
      const today = new Date().toLocaleDateString('ru-RU');

      document.getElementById('modalContent').innerHTML = `
        <h2>${l ? 'Редактировать запись' : 'Новая запись лора'}</h2>
        <div class="form-group">
          <label>Дата</label>
          <input type="text" id="lDate" value="${l ? escapeHtml(l.date) : today}" placeholder="ДД.ММ.ГГГГ">
        </div>
        <div class="form-group">
          <label>Текст</label>
          <textarea id="lText" placeholder="Что произошло?" style="min-height:140px">${l ? escapeHtml(l.text) : ''}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
          <button class="btn btn-primary" onclick="saveLore()">${l ? 'Сохранить' : 'Добавить'}</button>
        </div>
      `;
      openModal();
    }

    function saveLore() {
      const date = document.getElementById('lDate').value.trim() || new Date().toLocaleDateString('ru-RU');
      const text = document.getElementById('lText').value.trim();
      if (!text) { toast('Напиши текст', 'error'); return; }

      if (editingId) {
        const l = state.lore.find(x => x.id === editingId);
        if (l) {
          l.date = date;
          l.text = text;
          toast('Запись обновлена');
        }
      } else {
        state.lore.push({ id: uid(), date, text, createdAt: Date.now() });
        toast('Запись добавлена');
      }
      save();
      closeModal();
      renderLore();
    }

    function deleteLore(id) {
      if (!confirm('Удалить запись?')) return;
      state.lore = state.lore.filter(x => x.id !== id);
      save();
      renderLore();
      toast('Запись удалена');
    }

    // ===================== SAVE / EXPORT / IMPORT =====================
    function exportSave() {
      const data = JSON.stringify(state, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'life-rpg-v4-save.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('Сейв экспортирован');
    }

    function importSave(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data || !data.hero) throw new Error('Invalid');
          state = {
            hero: Object.assign({ name: 'Безымянный герой', xp: 0, titleId: 'newbie' }, data.hero),
            directions: Array.isArray(data.directions) ? data.directions : [],
            quests: Array.isArray(data.quests) ? data.quests : [],
            lore: Array.isArray(data.lore) ? data.lore : [],
            stats: data.stats || { completed: 0, totalXp: 0 },
            streak: data.streak || { current: 0, longest: 0, lastDate: null },
            unlockedTitles: Array.isArray(data.unlockedTitles) ? data.unlockedTitles : ['newbie'],
            unlockedAchievements: Array.isArray(data.unlockedAchievements) ? data.unlockedAchievements : [],
            reflections: Array.isArray(data.reflections) ? data.reflections : []
          };
          state.directions.forEach(d => {
            d.xp = d.xp || 0;
            (d.nodes || []).forEach(n => { n.xp = n.xp || 0; });
          });
          save();
          renderAll();
          toast('Сохранение загружено', 'success');
        } catch (err) {
          toast('Некорректный JSON', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetAll() {
      if (!confirm('Сбросить ВЕСЬ прогресс? Это нельзя отменить.')) return;
      if (!confirm('Точно? Все квесты, навыки и лор будут удалены.')) return;
      state = {
        hero: { name: 'Безымянный герой', xp: 0, titleId: 'newbie' },
        directions: [],
        quests: [],
        lore: [],
        stats: { completed: 0, totalXp: 0 },
        streak: { current: 0, longest: 0, lastDate: null },
        unlockedTitles: ['newbie'],
        unlockedAchievements: [],
        reflections: []
      };
      save();
      closeTreeView();
      renderAll();
      toast('Прогресс сброшен');
    }

    // ===================== MODAL & NAV =====================
    function openModal() {
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      editingId = null;
      editingType = null;
      skillParentId = null;
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });

    function switchScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');
      document.querySelector(`.nav-btn[data-screen="${name}"]`).classList.add('active');

      if (name === 'hero') renderHero();
      if (name === 'quests') renderQuests();
      if (name === 'skills') renderDirections();
      if (name === 'lore') renderLore();
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchScreen(btn.dataset.screen));
    });

    document.getElementById('questFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('#questFilters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      questFilter = btn.dataset.filter;
      renderQuests();
    });

    function renderAll() {
      renderHero();
      renderQuests();
      renderDirections();
      renderLore();
    }

    // ===================== INIT =====================
    load();
    checkTitlesAndAchievements();
    renderAll();
    try {
      if (!localStorage.getItem('life_rpg_v4_onboarded')) {
        setTimeout(showOnboarding, 400);
      }
    } catch(e) {}

    // Prevent accidental zoom on double-tap (iOS)
    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouch <= 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
  </script>
</body>
</html>
