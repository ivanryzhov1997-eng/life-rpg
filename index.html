<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LIFE RPG — V2.1 FIX</title>
<style>
:root{--bg:#080b12;--panel:#111722;--panel2:#182130;--line:#263348;--text:#eef3ff;--muted:#8d9ab0;--accent:#72f0a8;--gold:#ffd166;--red:#ff6b7a;--blue:#6eb5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at top,#152033 0,#080b12 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{border:0;color:var(--text);cursor:pointer;touch-action:manipulation}
.app{max-width:900px;margin:auto;padding:14px 12px 90px}
header{padding:10px 4px 14px}
h1{font-size:25px;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:sticky;top:0;z-index:10;background:rgba(8,11,18,.94);padding:8px 0;backdrop-filter:blur(12px)}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 3px;font-size:11px}
.tab.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(114,240,168,.2) inset}
.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:linear-gradient(145deg,#121a27,#0e141e);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statbig{font-size:29px;font-weight:800}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.bar{height:8px;background:#202b3d;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent);width:0%;transition:.25s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.quest{border:1px solid var(--line);background:#0e151f;border-radius:14px;padding:12px;margin:9px 0}
.quest.done{opacity:.55}.qtitle{font-weight:750}.qmeta{font-size:12px;color:var(--muted);margin:5px 0 10px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.primary,.secondary,.danger{border-radius:10px;padding:10px 12px;font-weight:700}
.primary{background:var(--accent);color:#06100a}.secondary{background:#202c3f}.danger{background:#3b1c25;color:#ffb0b8}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.zone{min-height:130px;display:flex;flex-direction:column;justify-content:space-between}.locked{filter:grayscale(1);opacity:.5}
.skill{padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0;background:#0d141e}
.skill.unlocked{border-color:var(--accent)}.skill.locked{opacity:.45}
.small{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:10px}
.modal.open{display:flex}.modalbox{width:min(620px,100%);background:#101722;border:1px solid var(--line);border-radius:20px;padding:16px}
input,select{width:100%;background:#0a1018;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;margin:5px 0 10px;outline:none}
.notice{background:#111e2d;border:1px solid #29405e;border-radius:12px;padding:11px;font-size:12px;color:#b8c8de;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#eafef2;color:#07120b;padding:12px 16px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:0 10px 30px #0008}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.tabs{grid-template-columns:repeat(3,1fr)}.hero,.grid{grid-template-columns:1fr 1fr}.tab{padding:9px 2px}.app{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>⚔️ LIFE RPG</h1>
<div class="sub">V2.1 — FIXED / mobile build</div>
</header>

<div class="tabs" id="tabs">
<button class="tab active" data-view="character">👤 Герой</button>
<button class="tab" data-view="world">🗺 Мир</button>
<button class="tab" data-view="quests">⚔️ Квесты</button>
<button class="tab" data-view="skills">🌳 Навыки</button>
<button class="tab" data-view="inventory">🎒 Лут</button>
<button class="tab" data-view="lore">📜 Лор</button>
</div>

<section id="character" class="view active"></section>
<section id="world" class="view"></section>
<section id="quests" class="view"></section>
<section id="skills" class="view"></section>
<section id="inventory" class="view"></section>
<section id="lore" class="view"></section>
</div>

<input id="restoreFile" type="file" accept="application/json" style="display:none">
<div class="modal" id="modal">
<div class="modalbox">
<div class="row"><h2 style="margin:0">➕ Новый квест</h2><button class="secondary" id="closeModal">✕</button></div>
<label>Название<input id="newTitle" placeholder="Например: 20 минут гитары"></label>
<label>Тип<select id="newType"><option value="SIDE">SIDE QUEST</option><option value="MAIN">MAIN QUEST</option><option value="BOSS">BOSS</option></select></label>
<label>Категория<select id="newCat"><option value="BODY">BODY</option><option value="MUSIC">MUSIC</option><option value="MONEY">MONEY</option><option value="SOCIAL">SOCIAL</option><option value="KNOWLEDGE">KNOWLEDGE</option></select></label>
<div class="grid"><label>XP<input id="newXp" type="number" value="50"></label><label>Энергия<input id="newEnergy" type="number" value="10"></label></div>
<div class="actions"><button class="primary" id="addQuest">СОЗДАТЬ</button><button class="secondary" id="cancelModal">ОТМЕНА</button></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

const KEY="life_rpg_world_v21_fixed";
const CATS=["BODY","MUSIC","MONEY","SOCIAL","KNOWLEDGE"];
const CAT_ICON={BODY:"💪",MUSIC:"🎸",MONEY:"💰",SOCIAL:"🗣️",KNOWLEDGE:"🧠"};

const defaultState={
 level:1,xp:0,energy:100,skillPoints:0,eventDone:false,eventDate:"",
 stats:{BODY:1,MUSIC:1,MONEY:1,SOCIAL:1,KNOWLEDGE:1},
 quests:[
  {id:"q1",title:"Минимум тела: 10 минут движения",type:"SIDE",cat:"BODY",xp:35,energy:5,done:false},
  {id:"q2",title:"Гитара: 20 минут",type:"SIDE",cat:"MUSIC",xp:40,energy:8,done:false},
  {id:"q3",title:"English: 15 минут",type:"SIDE",cat:"KNOWLEDGE",xp:35,energy:5,done:false},
  {id:"q4",title:"Один нормальный разговор",type:"SIDE",cat:"SOCIAL",xp:45,energy:6,done:false},
  {id:"q5",title:"Одно действие на деньги",type:"MAIN",cat:"MONEY",xp:70,energy:10,done:false},
  {id:"q6",title:"Собрать фундамент LIFE RPG",type:"MAIN",cat:"KNOWLEDGE",xp:100,energy:15,done:false}
 ],
inventory:[],lore:[],achievements:[]
};

let state=load();

function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(raw){
   const s=JSON.parse(raw);
   return Object.assign(structuredClone(defaultState),s,{stats:Object.assign({},defaultState.stats,s.stats||{})});
  }
 }catch(e){}
 return structuredClone(defaultState);
}
function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
  localStorage.setItem(KEY+"_lastSaved",new Date().toISOString());
 }catch(e){}
}
function backup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="LIFE_RPG_SAVE_"+today()+".json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast("💾 Сохранение скачано");
}
function restore(){
 document.getElementById("restoreFile").click();
}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function xpNeed(){return 100+state.level*50}
function toast(msg){
 const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
 clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1800);
}
function levelCheck(){
 let leveled=false;
 while(state.xp>=xpNeed()){state.xp-=xpNeed();state.level++;state.skillPoints++;leveled=true}
 if(leveled){state.lore.push("LVL UP → достигнут уровень "+state.level);toast("🔥 LEVEL UP! LVL "+state.level)}
}
function completeQuest(id){
 const q=state.quests.find(x=>x.id===id);
 if(!q||q.done)return;
 if(state.energy<q.energy){toast("⚡ Не хватает энергии");return}
 q.done=true;state.energy-=q.energy;state.xp+=q.xp;state.stats[q.cat]=(state.stats[q.cat]||1)+1;
 state.skillPoints+=1;
 const loot=q.type==="BOSS"?"🏆 Boss Trophy":(CAT_ICON[q.cat]+" "+q.cat+" Token");
 state.inventory.push(loot);
 state.lore.push("Квест выполнен: "+q.title+" (+"+q.xp+" XP)");
 levelCheck();save();renderAll();toast("✅ Квест завершён  +"+q.xp+" XP");
}
function resetQuest(id){
 const q=state.quests.find(x=>x.id===id);if(q){q.done=false;save();renderAll()}
}
function deleteQuest(id){
 state.quests=state.quests.filter(q=>q.id!==id);save();renderAll()
}
function unlockSkill(cat,idx){
 const costs=[1,2,3];
 const key=cat+"-"+idx;
 const need=idx+1;
 if(state.skillPoints<costs[idx]){toast("🌳 Не хватает очков навыков");return}
 const existing=state.achievements.includes("skill:"+key);
 if(existing){toast("Уже разблокировано");return}
 if(state.stats[cat]<need){toast("🔒 Нужен "+cat+" LVL "+need);return}
 state.skillPoints-=costs[idx];state.achievements.push("skill:"+key);
 state.lore.push("Навык разблокирован: "+cat+" / TIER "+need);
 save();renderAll();toast("🌳 Навык разблокирован");
}

function renderCharacter(){
 const total=xpNeed(),pct=Math.min(100,state.xp/total*100);
 document.getElementById("character").innerHTML=`
 <div class="notice">🎮 <b>Главное правило:</b> игра должна обслуживать реальную жизнь. Выполнил действие в мире → получил прогресс здесь.</div>
 <div class="hero">
  <div class="card"><div class="label">LEVEL</div><div class="statbig">${state.level}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="small">${state.xp} / ${total} XP</div></div>
  <div class="card"><div class="label">ENERGY</div><div class="statbig">⚡ ${state.energy}</div><div class="actions"><button class="secondary" data-action="energy">+20 ENERGY</button></div></div>
 </div>
 <div class="card"><div class="row"><h2 style="margin:0">Характеристики</h2><b>🌟 ${state.skillPoints} SP</b></div>
 ${CATS.map(c=>`<div style="margin:13px 0"><div class="row"><span>${CAT_ICON[c]} ${c}</span><b>LVL ${state.stats[c]}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,state.stats[c]/10*100)}%"></div></div></div>`).join("")}</div>
 <div class="card"><h2 style="margin-top:0">Сегодня</h2><div class="small">${state.quests.filter(q=>q.done).length} квестов выполнено из ${state.quests.length}</div><div class="actions" style="margin-top:10px"><button class="primary" data-action="quests">⚔️ К КВЕСТАМ</button><button class="secondary" data-action="event">🎲 DAILY EVENT</button><button class="secondary" data-action="backup">💾 СОХРАНИТЬ</button><button class="secondary" data-action="restore">📥 ЗАГРУЗИТЬ</button></div></div>`;
}
function renderWorld(){
 const zones=[
  ["WILDLANDS","💪","Тело и физическая база",1,"BODY"],
  ["MUSIC DISTRICT","🎸","Гитара, голос, тексты",2,"MUSIC"],
  ["ACADEMY","🧠","Университет и знания",1,"KNOWLEDGE"],
  ["CITY","🗣️","Социальные квесты",2,"SOCIAL"],
  ["MERCHANT GUILD","💰","Деньги и навыки",2,"MONEY"]
 ];
 document.getElementById("world").innerHTML=`<div class="card"><h2 style="margin-top:0">🗺️ Мир</h2><div class="small">Территории открываются через реальные характеристики.</div></div><div class="grid">${zones.map(z=>{
 const open=state.stats[z[4]]>=z[3];
 return `<div class="card zone ${open?"":"locked"}"><div><div class="label">${open?"UNLOCKED":"LOCKED"}</div><h2>${z[1]} ${z[0]}</h2><div class="small">${z[2]}</div></div><div class="row"><span class="small">${open?"Доступно":"Нужен "+z[4]+" LVL "+z[3]}</span><b>${open?"✓":"🔒"}</b></div></div>`}).join("")}</div>`;
}
function renderQuests(){
 const sorted=[...state.quests].sort((a,b)=>Number(a.done)-Number(b.done));
 document.getElementById("quests").innerHTML=`<div class="row" style="margin:5px 0 10px"><div><h2 style="margin:0">⚔️ Квесты</h2><div class="small">Делай в реальности → отмечай здесь.</div></div><button class="primary" data-action="openModal">＋</button></div>
 ${sorted.map(q=>`<div class="quest ${q.done?"done":""}">
 <div class="row"><div class="qtitle">${CAT_ICON[q.cat]||"⚔️"} ${esc(q.title)}</div><b>${q.type}</b></div>
 <div class="qmeta">+${q.xp} XP · ⚡${q.energy} · ${q.cat}</div>
 <div class="actions">
 ${q.done?`<button class="secondary" data-action="reset" data-id="${q.id}">↩ СБРОСИТЬ</button>`:`<button class="primary" data-action="complete" data-id="${q.id}" ${state.energy<q.energy?"disabled":""}>✓ ВЫПОЛНИТЬ</button>`}
 <button class="danger" data-action="delete" data-id="${q.id}">Удалить</button>
 </div></div>`).join("")}`;
}
function renderSkills(){
 document.getElementById("skills").innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">🌳 Дерево навыков</h2><b>${state.skillPoints} SP</b></div><div class="small">Каждый реальный квест даёт 1 SP.</div></div>
 ${CATS.map(c=>`<div class="card"><h2 style="margin:0">${CAT_ICON[c]} ${c} · LVL ${state.stats[c]}</h2>
 ${[1,2,3].map((n,i)=>{
 const unlocked=state.achievements.includes("skill:"+c+"-"+i), cost=[1,2,3][i], ok=state.stats[c]>=n;
 return `<div class="skill ${unlocked?"unlocked":(!ok?"locked":"")}"><div class="row"><b>TIER ${n}</b><span>${unlocked?"✓ OPEN":ok?"READY":"🔒 LVL "+n}</span></div><div class="small">${["Первый перк","Усиленный перк","Эпический перк"][i]} · ${cost} SP</div><div class="actions" style="margin-top:7px"><button class="${ok&&!unlocked?"primary":"secondary"}" data-action="skill" data-cat="${c}" data-idx="${i}" ${(!ok||unlocked)?"disabled":""}>${unlocked?"РАЗБЛОКИРОВАНО":ok?"РАЗБЛОКИРОВАТЬ":"НЕДОСТУПНО"}</button></div></div>`
 }).join("")}</div>`).join("")}`;
}
function renderInventory(){
 document.getElementById("inventory").innerHTML=`<div class="card"><h2 style="margin-top:0">🎒 Инвентарь</h2><div class="small">Лут — следы реальных действий.</div></div>
 <div class="grid">${state.inventory.length?state.inventory.map((x,i)=>`<div class="card"><div style="font-size:28px">${esc(x).slice(0,2)}</div><b>${esc(x)}</b><div class="small">#${i+1}</div></div>`).join(""):`<div class="card"><div class="small">Пока пусто. Первый квест даст первый предмет.</div></div>`}</div>`;
}
function renderLore(){
 const evDate=today();
 if(state.eventDate!==evDate){state.eventDone=false;state.eventDate=evDate;save()}
 const events=["NPC EVENT: Напиши человеку, с которым давно не общался.","LORE EVENT: Запиши 3 строки о сегодняшнем дне.","MERCHANT EVENT: Найди одну идею для заработка.","MUSIC EVENT: Сними короткий кусок игры на гитаре.","ACADEMY EVENT: Разбери одну вещь, которую не понимаешь."];
 const idx=new Date().getDate()%events.length;
 document.getElementById("lore").innerHTML=`<div class="card"><h2 style="margin-top:0">💾 Сохранение прогресса</h2><div class="small">Прогресс хранится в браузере. Для железной защиты используй «СОХРАНИТЬ» — это создаёт резервный JSON-файл, который можно загрузить обратно на любом устройстве.</div></div><div class="card"><h2 style="margin-top:0">🎲 Daily Event</h2><p>${events[idx]}</p><button class="primary" data-action="event" ${state.eventDone?"disabled":""}>${state.eventDone?"✓ ЗАВЕРШЕНО":"+30 XP"}</button></div>
 <div class="card"><h2 style="margin-top:0">📜 Хроника</h2>${state.lore.length?state.lore.slice().reverse().map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">${esc(x)}</div>`).join(""):`<div class="small">История ещё не написана.</div>`}</div>`;
}
function dailyEvent(){
 if(state.eventDone){toast("Сегодня событие уже выполнено");return}
 state.eventDone=true;state.xp+=30;state.lore.push("Daily Event выполнен: +30 XP");levelCheck();save();renderAll();toast("🎲 +30 XP");
}
function renderAll(){renderCharacter();renderWorld();renderQuests();renderSkills();renderInventory();renderLore()}

document.getElementById("tabs").addEventListener("click",e=>{
 const b=e.target.closest("[data-view]");if(!b)return;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
 document.getElementById(b.dataset.view).classList.add("active");
});

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="complete")completeQuest(b.dataset.id);
 else if(a==="reset")resetQuest(b.dataset.id);
 else if(a==="delete"){if(confirm("Удалить этот квест?"))deleteQuest(b.dataset.id)}
 else if(a==="skill")unlockSkill(b.dataset.cat,Number(b.dataset.idx));
 else if(a==="event")dailyEvent();
 else if(a==="energy"){state.energy=Math.min(100,state.energy+20);save();renderAll();toast("⚡ +20 ENERGY")}
 else if(a==="openModal")document.getElementById("modal").classList.add("open");
 else if(a==="quests"){document.querySelector('[data-view="quests"]').click()}
 else if(a==="backup")backup();
 else if(a==="restore")restore();
});
document.getElementById("closeModal").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("cancelModal").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")e.target.classList.remove("open")});
document.getElementById("addQuest").onclick=()=>{
 const title=document.getElementById("newTitle").value.trim();if(!title){toast("Введите название");return}
 state.quests.push({id:"custom_"+Date.now(),title,type:document.getElementById("newType").value,cat:document.getElementById("newCat").value,xp:Math.max(1,Number(document.getElementById("newXp").value)||50),energy:Math.max(0,Number(document.getElementById("newEnergy").value)||10),done:false});
 save();document.getElementById("modal").classList.remove("open");document.getElementById("newTitle").value="";renderAll();toast("⚔️ Квест создан");
};

document.getElementById("restoreFile").addEventListener("change",function(){
 const file=this.files && this.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  try{
   const imported=JSON.parse(reader.result);
   if(!imported || typeof imported!=="object" || !imported.stats || !Array.isArray(imported.quests)){
    throw new Error("bad save");
   }
   state=Object.assign(structuredClone(defaultState),imported,{stats:Object.assign({},defaultState.stats,imported.stats||{})});
   save();renderAll();toast("📥 Прогресс восстановлен");
  }catch(e){toast("❌ Файл сохранения повреждён")}
 };
 reader.readAsText(file);this.value="";
});
renderAll();
})();
</script>
</body>
</html>
