name: Validate Supabase Auth app

on:
  push:
    branches:
      - main
      - architecture/audit-and-modularization
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/validate-supabase-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required files and script order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const expected = [
            './assets/js/state/initial-state.js',
            './assets/js/state/store.js',
            './assets/js/state/serialization.js',
            './assets/js/01-core.js',
            './assets/js/02-cloud-auth.js',
            './assets/js/state/migrations.js',
            './assets/js/state/cloud-response.js',
            './assets/js/state/backup-utils.js',
            './assets/js/03-state-and-systems.js',
            './assets/js/04-ai.js',
            './assets/js/05-quests-goals-directions.js',
            './assets/js/06-skills-lore-save.js',
            './assets/js/07-navigation-mentor.js',
            './assets/js/08-theme-init.js'
          ];
          if (!html.includes('./assets/css/app.css')) throw new Error('CSS link missing from index.html');
          let previous = -1;
          for (const path of expected) {
            if (!fs.existsSync(path)) throw new Error('Missing file: ' + path);
            const position = html.indexOf('src="' + path + '"');
            if (position < 0) throw new Error('Script not linked: ' + path);
            if (position <= previous) throw new Error('Script order is incorrect at: ' + path);
            previous = position;
          }
          if (!fs.existsSync('assets/js/state/initial-state.js')) throw new Error('Missing initial-state.js');
          if (!fs.existsSync('assets/js/state/store.js')) throw new Error('Missing store.js');
          if (!fs.existsSync('assets/js/state/serialization.js')) throw new Error('Missing serialization.js');
          if (!fs.existsSync('assets/js/state/migrations.js')) throw new Error('Missing migrations.js');
          if (!fs.existsSync('assets/js/state/cloud-response.js')) throw new Error('Missing cloud-response.js');
          if (!fs.existsSync('assets/js/state/backup-utils.js')) throw new Error('Missing backup-utils.js');
          if (!fs.existsSync('assets/css/app.css')) throw new Error('Missing app.css');
          console.log('HTML references, files and script order: OK');
          NODE


      - name: Test initial state factory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/initial-state.js', 'utf8'), context);
          const first = context.createInitialState(5);
          const second = context.createInitialState(5);
          assert.equal(first.schemaVersion, 5);
          assert.equal(first.hero.xp, 0);
          assert.deepEqual(Object.keys(first), ['schemaVersion','hero','directions','quests','goals','lore','activityLog','rewardLedger','stats','streak','unlockedTitles','unlockedAchievements','reflections','ai','ui']);
          first.directions.push({ id: 'test' });
          assert.equal(second.directions.length, 0, 'factory must return independent arrays');
          console.log('Initial state factory: OK');
          NODE

      - name: Test state store replacement API
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/store.js', 'utf8'), context);
          vm.runInNewContext('let state = { marker: "before" };', context);
          assert.equal(context.getState().marker, 'before');
          const next = { marker: 'after' };
          assert.equal(context.replaceState(next), next);
          assert.equal(context.getState(), next);
          assert.throws(() => context.replaceState(null), error => error && error.name === 'TypeError');
          console.log('State store replacement API: OK');
          NODE

      - name: Test state migrations and validation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/migrations.js', 'utf8'), context);
          const input = {
            hero: { xp: 120 },
            directions: [{ name: 'Python', nodes: [{}] }],
            quests: [{ title: 'Test', difficulty: 2 }],
            ai: { model: 'llama-3.3-70b-versatile' }
          };
          const xp = { SIDE: { 2: 50 }, HABIT: { 2: 30 } };
          const migrated = context.normalizeStateData(input, 5, xp);
          assert.equal(migrated.schemaVersion, 5);
          assert.equal(migrated.hero.xp, 120);
          assert.equal(migrated.quests[0].type, 'SIDE');
          assert.equal(migrated.quests[0].xp, 50);
          assert.equal(migrated.ai.model, 'openai/gpt-oss-120b');
          assert.equal(input.directions[0].xp, undefined, 'migration must not mutate source data');
          assert.equal(context.validateImport({ hero: { xp: 1 } }), null);
          assert.equal(context.validateImport({ hero: { xp: 'bad' } }), 'hero.xp не число');
          console.log('State migrations and validation: OK');
          NODE

      - name: Enforce state replacement boundary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'assets/js/02-cloud-auth.js',
            'assets/js/03-state-and-systems.js',
            'assets/js/04-ai.js',
            'assets/js/05-quests-goals-directions.js',
            'assets/js/06-skills-lore-save.js',
            'assets/js/07-navigation-mentor.js',
            'assets/js/08-theme-init.js'
          ];
          const violations = [];
          for (const file of files) {
            const lines = fs.readFileSync(file, 'utf8').split('\n');
            lines.forEach((line, index) => {
              if (/\bstate\s*=(?!=|>)/.test(line)) violations.push(file + ':' + (index + 1) + ': ' + line.trim());
            });
          }
          if (violations.length) throw new Error('Direct state replacement outside core:\n' + violations.join('\n'));
          console.log('State replacement boundary: OK');
          NODE

      - name: Test state serialization
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/serialization.js', 'utf8'), context);
          const source = { schemaVersion: 1, hero: { xp: 90 }, ai: { apiKey: 'secret', model: 'model-a' } };
          const saved = context.createPersistedState(source, 5);
          assert.equal(saved.schemaVersion, 5);
          assert.equal(saved.hero.xp, 90);
          assert.equal(saved.ai.apiKey, undefined);
          assert.equal(saved.ai.model, 'model-a');
          assert.equal(source.ai.apiKey, 'secret', 'serializer must not mutate live state');
          saved.hero.xp = 0;
          assert.equal(source.hero.xp, 90, 'snapshot must be detached');
          console.log('State serialization: OK');
          NODE

      - name: Test cloud response classification
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/cloud-response.js', 'utf8'), context);
          const validate = data => data && data.hero ? null : 'invalid payload';
          assert.equal(context.classifyCloudRows([], validate).kind, 'empty');
          assert.equal(context.classifyCloudRows([{ data: { hero: {} } }], validate).kind, 'record');
          assert.equal(context.classifyCloudRows([{ data: { bad: true } }], validate).kind, 'invalid');
          assert.equal(context.classifyCloudRows([{}], validate).kind, 'invalid');
          assert.equal(context.classifyCloudRows({}, validate).kind, 'invalid');
          assert.equal(context.classifyCloudRows([{ data: { hero: {} } }, { data: { hero: {} } }], validate).kind, 'invalid');
          assert.equal(context.getCloudSyncFallback(''), 'upload');
          assert.equal(context.getCloudSyncFallback('конфликт сохранений: local/cloud'), 'conflict');
          assert.equal(context.getCloudSyncFallback('HTTP 500'), 'blocked');
          console.log('Cloud response classification and sync fallback: OK');
          NODE

      - name: Test backup utilities
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/backup-utils.js', 'utf8'), context);
          assert.equal(context.createDailyBackupKey('2026-11-09'), 'life_rpg_v4_backup_20261109');
          assert.deepEqual(
            Array.from(context.getBackupKeysToDelete([
              'life_rpg_v4_backup_20261101',
              'other_key',
              'life_rpg_v4_backup_20261103',
              'life_rpg_v4_backup_20261102'
            ], 'life_rpg_v4_backup_', 2)),
            ['life_rpg_v4_backup_20261101']
          );
          assert.deepEqual(Array.from(context.getBackupKeysToDelete(['a','b'], 'x_', 7)), []);
          assert.throws(() => context.createDailyBackupKey('09-11-2026'));
          assert.throws(() => context.getBackupKeysToDelete([], 'x_', -1));
          console.log('Backup utilities: OK');
          NODE

      - name: Check combined JavaScript syntax
        run: |
          cat assets/js/state/initial-state.js \
              assets/js/state/store.js \
              assets/js/state/serialization.js \
              assets/js/01-core.js \
              assets/js/02-cloud-auth.js \
              assets/js/state/migrations.js \
              assets/js/03-state-and-systems.js \
              assets/js/04-ai.js \
              assets/js/05-quests-goals-directions.js \
              assets/js/06-skills-lore-save.js \
              assets/js/07-navigation-mentor.js \
              assets/js/08-theme-init.js > /tmp/life-rpg-combined.js
          node --check /tmp/life-rpg-combined.js
