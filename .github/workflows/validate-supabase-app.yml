name: Validate Supabase Auth app

on:
  push:
    branches:
      - main
      - architecture/audit-and-modularization
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/validate-supabase-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required files and script order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const expected = [
            './assets/js/state/initial-state.js',
            './assets/js/state/store.js',
            './assets/js/state/serialization.js',
            './assets/js/01-core.js',
            './assets/js/02-cloud-auth.js',
            './assets/js/state/tree-utils.js',
            './assets/js/state/migrations.js',
            './assets/js/state/cloud-response.js',
            './assets/js/state/backup-utils.js',
            './assets/js/state/merge.js',
            './assets/js/state/reward-utils.js',
            './assets/js/03-state-and-systems.js',
            './assets/js/04-ai.js',
            './assets/js/05-quests-goals-directions.js',
            './assets/js/06-skills-lore-save.js',
            './assets/js/07-navigation-mentor.js',
            './assets/js/08-theme-init.js'
          ];
          if (!html.includes('./assets/css/app.css')) throw new Error('CSS link missing from index.html');
          let previous = -1;
          for (const path of expected) {
            if (!fs.existsSync(path)) throw new Error('Missing file: ' + path);
            const position = html.indexOf('src="' + path + '"');
            if (position < 0) throw new Error('Script not linked: ' + path);
            if (position <= previous) throw new Error('Script order is incorrect at: ' + path);
            previous = position;
          }
          if (!fs.existsSync('assets/js/state/initial-state.js')) throw new Error('Missing initial-state.js');
          if (!fs.existsSync('assets/js/state/store.js')) throw new Error('Missing store.js');
          if (!fs.existsSync('assets/js/state/serialization.js')) throw new Error('Missing serialization.js');
          if (!fs.existsSync('assets/js/state/migrations.js')) throw new Error('Missing migrations.js');
          if (!fs.existsSync('assets/js/state/cloud-response.js')) throw new Error('Missing cloud-response.js');
          if (!fs.existsSync('assets/js/state/backup-utils.js')) throw new Error('Missing backup-utils.js');
          if (!fs.existsSync('assets/js/state/tree-utils.js')) throw new Error('Missing tree-utils.js');
          if ((html.match(/src="\.\/assets\/js\/state\/tree-utils\.js"/g) || []).length !== 1) {
            throw new Error('tree-utils.js must be loaded exactly once');
          }
          if (!fs.existsSync('assets/css/app.css')) throw new Error('Missing app.css');
          console.log('HTML references, files and script order: OK');
          NODE


      - name: Test initial state factory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/initial-state.js', 'utf8'), context);
          const first = context.createInitialState(5);
          const second = context.createInitialState(5);
          assert.equal(first.schemaVersion, 5);
          assert.equal(first.hero.xp, 0);
          assert.deepEqual(Object.keys(first), ['schemaVersion','hero','directions','quests','goals','lore','activityLog','rewardLedger','stats','streak','unlockedTitles','unlockedAchievements','reflections','ai','ui']);
          first.directions.push({ id: 'test' });
          assert.equal(second.directions.length, 0, 'factory must return independent arrays');
          console.log('Initial state factory: OK');
          NODE

      - name: Test state store replacement API
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/store.js', 'utf8'), context);
          vm.runInNewContext('let state = { marker: "before" };', context);
          assert.equal(context.getState().marker, 'before');
          const next = { marker: 'after' };
          assert.equal(context.replaceState(next), next);
          assert.equal(context.getState(), next);
          assert.throws(() => context.replaceState(null), error => error && error.name === 'TypeError');
          console.log('State store replacement API: OK');
          NODE

      - name: Test state migrations and validation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/tree-utils.js', 'utf8'), context);
          vm.runInNewContext(fs.readFileSync('assets/js/state/migrations.js', 'utf8'), context);
          const input = {
            hero: { xp: 120 },
            directions: [{ name: 'Python', nodes: [{}] }],
            quests: [{ title: 'Test', difficulty: 2 }],
            ai: { model: 'llama-3.3-70b-versatile' }
          };
          const xp = { SIDE: { 2: 50 }, HABIT: { 2: 30 } };
          const migrated = context.normalizeStateData(input, 5, xp);
          assert.equal(migrated.schemaVersion, 5);
          assert.equal(migrated.hero.xp, 120);
          assert.equal(migrated.quests[0].type, 'SIDE');
          assert.equal(migrated.quests[0].xp, 50);
          assert.equal(migrated.ai.model, 'openai/gpt-oss-120b');
          assert.equal(input.directions[0].xp, undefined, 'migration must not mutate source data');
          assert.equal(context.validateImport({ hero: { xp: 1 } }), null);
          assert.equal(context.validateImport({ hero: { xp: 'bad' } }), 'hero.xp не число');
          const cyclic = context.normalizeStateData({
            hero: { xp: 0 },
            directions: [{ id: 'd', nodes: [
              { id: 'a', parentId: 'b' }, { id: 'b', parentId: 'a' },
              { id: 'child', parentId: 'a' }, { id: 'orphan', parentId: 'missing' },
              { id: 'self', parentId: 'self' }
            ] }]
          }, 5, { SIDE: { 2: 50 } });
          const normalizedNodes = cyclic.directions[0].nodes;
          assert.equal(normalizedNodes.find(n => n.id === 'b').parentId, null,
            'cyclic parent chain must be broken into a reachable tree');
          assert.equal(normalizedNodes.find(n => n.id === 'orphan').parentId, null,
            'missing parent must be repaired to root');
          assert.equal(normalizedNodes.find(n => n.id === 'self').parentId, null,
            'self-parent must be repaired to root');
          assert.equal(normalizedNodes.find(n => n.id === 'child').parentId, 'a');
          console.log('State migrations and validation: OK');
          NODE

      - name: Test cycle-safe skill subtree traversal
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/tree-utils.js', 'utf8'), context);
          const nodes = [
            { id: 'a', parentId: 'b' },
            { id: 'b', parentId: 'a' },
            { id: 'child', parentId: 'a' },
            { id: 'grandchild', parentId: 'child' },
            { id: 'unrelated', parentId: null }
          ];
          const removed = context.collectSkillSubtreeIds(nodes, 'a');
          assert.deepEqual([...removed].sort(), ['a', 'b', 'child', 'grandchild']);
          assert.equal(removed.has('unrelated'), false);
          console.log('Cycle-safe skill subtree traversal: OK');
          NODE

      - name: Test ID-mapped import merge
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/merge.js', 'utf8'), context);
          const migrate = value => JSON.parse(JSON.stringify(value));
          let nextId = 0;
          const createId = () => 'generated-' + (++nextId);
          const target = {
            hero: { name: 'Local Hero', xp: 80, titleId: 'local-title' },
            directions: [{ id: 'dir-local', name: 'Python', xp: 100, nodes: [{ id: 'skill-local', name: 'API', parentId: null, xp: 50 }] }],
            goals: [{ id: 'goal-local', title: 'Build API', horizon: 'medium', directionId: 'dir-local', metric: { target: 10, current: 2, unitLabel: 'tasks' }, status: 'active' }],
            quests: [
              { id: 'quest-existing', title: 'Old task', type: 'SIDE', done: false },
              { id: 'quest-same-title', title: 'Repeated title', type: 'SIDE', done: false }
            ],
            lore: [], reflections: [], activityLog: [], rewardLedger: [],
            stats: { completed: 2 }, streak: { current: 1, longest: 2, lastDate: '2026-11-08' },
            unlockedTitles: ['newbie'], unlockedAchievements: []
          };
          const incoming = {
            hero: { name: 'Backup Hero', xp: 120, titleId: 'backup-title' },
            directions: [{ id: 'dir-import', name: 'Python', xp: 180, nodes: [{ id: 'skill-import', name: 'API', parentId: null, xp: 90 }, { id: 'child-import', name: 'Auth', parentId: 'skill-import' }] }],
            goals: [{ id: 'goal-import', title: 'Build API', horizon: 'medium', directionId: 'dir-import', metric: { target: 10, current: 7, unitLabel: 'tasks' }, status: 'active' }],
            quests: [
              { id: 'quest-import', title: 'Implement auth', type: 'SIDE', done: true, targetType: 'SKILL', targetId: 'child-import', goalId: 'goal-import', goalUnits: 2 },
              { id: 'quest-existing', title: 'Old task', type: 'SIDE', done: true, completedAt: 200, result: 'completed in imported save' },
              { id: 'quest-distinct', title: 'Repeated title', type: 'SIDE', done: false }
            ],
            rewardLedger: [{ eventId: 'event-import', questId: 'quest-import', xp: 40, at: 100 }],
            activityLog: [{ id: 'event-import', questId: 'quest-import', goalId: 'goal-import', title: 'Implement auth', xp: 40, at: 100 }],
            reflections: [{ id: 'reflection-import', questId: 'quest-import', text: 'Done' }],
            lore: [{ text: 'Imported lore', date: '2026-11-09' }],
            stats: { completed: 5 }, streak: { current: 3, longest: 4, lastDate: '2026-11-09' },
            unlockedTitles: ['newbie', 'builder'], unlockedAchievements: ['first-quest']
          };
          const merged = context.mergeImportedStateData(incoming, target, migrate, createId);
          const python = merged.directions.find(x => x.id === 'dir-local');
          assert.equal(merged.directions.length, 1, 'same direction by name must merge');
          assert.equal(python.nodes.length, 2, 'skill nodes must merge by mapped parent');
          assert.equal(python.xp, 180, 'direction XP must not be lost');
          assert.equal(python.nodes.find(x => x.name === 'API').xp, 90, 'skill XP must not be lost');
          const auth = python.nodes.find(x => x.name === 'Auth');
          assert.equal(merged.quests.find(x => x.id === 'quest-import').targetId, auth.id, 'quest skill target must be remapped');
          assert.equal(merged.quests.find(x => x.id === 'quest-import').goalId, 'goal-local', 'quest goal must be remapped');
          assert.equal(merged.quests.find(x => x.id === 'quest-existing').done, true, 'newer completion must update existing quest');
          assert.equal(merged.goals[0].metric.current, 7, 'goal progress must retain the greater value');
          assert.equal(merged.goals[0].directionId, 'dir-local', 'goal direction must be remapped');
          assert.equal(merged.rewardLedger[0].questId, 'quest-import');
          assert.equal(merged.activityLog[0].questId, 'quest-import');
          assert.equal(merged.activityLog[0].goalId, 'goal-local');
          assert.equal(merged.reflections[0].questId, 'quest-import');
          assert.equal(merged.hero.xp, 120);
          assert.equal(merged.hero.name, 'Local Hero', 'merge must preserve the local hero name');
          assert.equal(merged.hero.titleId, 'local-title', 'merge must preserve the locally selected title');
          assert.equal(merged.stats.completed, 5);
          const repeated = context.mergeImportedStateData(incoming, merged, migrate, createId);
          assert.equal(repeated.directions.length, 1, 'reimport must not duplicate directions');
          assert.equal(repeated.quests.length, 4, 'reimport must not duplicate quests or collapse distinct same-title quests');
          assert.equal(repeated.goals.length, 1, 'reimport must not duplicate goals');
          assert.equal(repeated.rewardLedger.length, 1, 'reimport must not duplicate rewards');
          assert.equal(repeated.activityLog.length, 1, 'reimport must not duplicate activity events');
          assert.equal(repeated.reflections.length, 1, 'reimport must not duplicate reflections');
          assert.equal(repeated.lore.length, 1, 'reimport must not duplicate lore');
          assert.equal(target.directions[0].nodes.length, 1, 'merge must not mutate destination input');

          // A partial backup may contain a child whose parent already exists
          // locally but is not included in the imported subtree.
          const partialTarget = {
            hero: { name: 'Local', xp: 0 },
            directions: [{ id: 'dir-local', name: 'Python', nodes: [
              { id: 'parent-local', name: 'Existing parent', parentId: null, xp: 10 }
            ] }],
            goals: [], quests: [], lore: [], reflections: [], activityLog: [], rewardLedger: [],
            stats: {}, streak: {}, unlockedTitles: ['newbie'], unlockedAchievements: []
          };
          const partialIncoming = {
            hero: { name: 'Backup', xp: 0 },
            directions: [{ id: 'dir-backup', name: 'Python', nodes: [
              { id: 'child-backup', name: 'Imported child', parentId: 'parent-local', xp: 5 }
            ] }],
            goals: [], quests: [
              { id: 'quest-child', title: 'Work on child', type: 'SIDE', done: false,
                targetType: 'SKILL', targetId: 'child-backup' }
            ],
            lore: [], reflections: [], activityLog: [], rewardLedger: [],
            stats: {}, streak: {}, unlockedTitles: ['newbie'], unlockedAchievements: []
          };
          const partial = context.mergeImportedStateData(partialIncoming, partialTarget, migrate, createId);
          const importedChild = partial.directions[0].nodes.find(x => x.id !== 'parent-local');
          assert.equal(importedChild.parentId, 'parent-local',
            'existing destination parent links must survive partial subtree imports');
          assert.equal(partial.quests.find(x => x.id === 'quest-child').targetId, importedChild.id,
            'quest target must point to the imported child');

          console.log('ID-mapped import merge: OK');
          NODE

      - name: Guard account-bound cloud operations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cloud = fs.readFileSync('assets/js/03-state-and-systems.js', 'utf8');
          const boot = fs.readFileSync('assets/js/08-theme-init.js', 'utf8');
          const required = [
            ['queued saves capture requesting account', /const requestedUserId = authUser && authUser\.id/],
            ['cloud writes require loaded account state', /if \(!cloudReady\)[\s\S]{0,180}облачная версия ещё не загружена/],
            ['cross-account local saves require explicit transfer', /isLocalSaveOwnedByAnotherAccount\(getLocalCloudOwner\(\), uid[\s\S]*локальная копия принадлежит другому аккаунту/],
            ['manual transfer requires confirmation', /локальная копия принадлежит другому аккаунту[\s\S]*const transfer = confirm/],
            ['manual local conflict choice explicitly unlocks write', /cloudReady = true;[\s\S]{0,100}await cloudSave\(true\)/],
            ['queued saves reject account switches', /authUser\.id !== requestedUserId/],
            ['cloud POST checks expected user', /performCloudSave\(force, expectedUserId\)/],
            ['fetch validates session user', /data\.session\.user\?\.id !== userId/],
            ['cloud load checks account after response', /if \(!authUser \|\| authUser\.id !== uid\) return false/],
            ['manual sync is bound to initiating user', /const requestedUserId = authUser\.id/],
            ['delayed save captures account ID', /function scheduleCloudSave\(\)[\s\S]*const requestedUserId = authUser\.id/],
            ['delayed save rejects account switch', /authUser\.id !== requestedUserId/],
            ['password sign-in resets cloud readiness on account switch', /previousUserId!==authUser\?\.id\)\{cloudReady=false/]
          ];
          for (const [label, pattern] of required) {
            if (!pattern.test(cloud)) throw new Error('Missing cloud safety guard: ' + label);
          }
          if (!/if \(oldId !== newId\)[\s\S]*cloudReady = false/.test(boot)) {
            throw new Error('Auth change must reset cloud-ready status');
          }
          console.log('Account-bound cloud operations: OK');
          NODE

      - name: Guard corrupt local save recovery
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const core = fs.readFileSync('assets/js/03-state-and-systems.js', 'utf8');
          const nav = fs.readFileSync('assets/js/07-navigation-mentor.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!/function markCorruptLocalSave\(raw, reason\)/.test(core)) {
            throw new Error('Invalid local save must be preserved as raw data');
          }
          if (!/function save\(\)[\s\S]*if \(localSaveWriteBlocked\)[\s\S]*return false/.test(core)) {
            throw new Error('Writes must stop while a corrupt save is unresolved');
          }
          if (!/resolveCorruptLocalSave\(prefix\)/.test(core)) {
            throw new Error('Recovery must back up the original raw save before unblocking writes');
          }
          if (!/if \(localSaveWriteBlocked\)[\s\S]*resolveCorruptLocalSave\('life_rpg_v5_preimport_'\)/.test(nav)
              || !/resolveCorruptLocalSave\('life_rpg_v5_prereset_'\)/.test(nav)
              || !/localSaveWriteBlocked && merge/.test(nav)) {
            throw new Error('Import replace and reset must resolve corrupt saves with a backup; merge must be blocked');
          }
          if (!/id="corruptSaveNotice"/.test(html) || !/exportCorruptSave\(\)/.test(nav)) {
            throw new Error('The user must be able to download the original corrupt save');
          }
          console.log('Corrupt local save recovery: OK');
          NODE

      - name: Guard corrupt-save cloud isolation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('assets/js/03-state-and-systems.js', 'utf8');
          const loadStart = source.indexOf('async function cloudLoad(');
          const saveStart = source.indexOf('async function performCloudSave(', loadStart);
          const saveEnd = source.indexOf('function scheduleCloudSave(', saveStart);
          const cloudLoad = source.slice(loadStart, saveStart);
          const cloudSave = source.slice(saveStart, saveEnd);
          if (!/if \(localSaveWriteBlocked\)[\s\S]*cloudLastError = 'повреждённое локальное сохранение: облачная запись заблокирована'[\s\S]*return false/.test(cloudLoad)) {
            throw new Error('An empty cloud row must not upload the initial state over a corrupt local save');
          }
          if (!/if \(localSaveWriteBlocked\)[\s\S]*cloudLastError = 'повреждённое локальное сохранение: облачная запись заблокирована'[\s\S]*return false/.test(cloudSave)) {
            throw new Error('Cloud POST must be blocked while local recovery is unresolved');
          }
          if (!/if \(hasLocalData\) backupLocalBeforeCloudReplace\(\)[\s\S]*if \(localSaveWriteBlocked\)[\s\S]*localSaveWriteBlocked = false/.test(cloudLoad)) {
            throw new Error('A valid cloud restore must back up existing local bytes before clearing the corrupt-save block');
          }
          console.log('Corrupt-save cloud isolation: OK');
          NODE

      - name: Guard direction deletion references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('assets/js/06-skills-lore-save.js', 'utf8');
          const start = source.indexOf('function deleteDirection(id)');
          const end = source.indexOf('// ===================== SKILL TREE', start);
          if (start < 0 || end < 0) throw new Error('deleteDirection function not found');
          const body = source.slice(start, end);
          if (!/state\.goals\.forEach\(goal => \{[\s\S]*goal\.directionId === id[\s\S]*goal\.directionId = null/.test(body)) {
            throw new Error('Deleting a direction must unlink goals that reference it');
          }
          console.log('Direction deletion references: OK');
          NODE

      - name: Test daily habit reward idempotency
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          // The app's day boundary follows the device's local calendar, not UTC.
          process.env.TZ = 'Europe/Amsterdam';
          const dateContext = {};
          vm.runInNewContext(fs.readFileSync('assets/js/02-cloud-auth.js', 'utf8'), dateContext);
          assert.equal(dateContext.localDateKey(new Date(Date.UTC(2026, 10, 9, 23, 30))), '2026-11-10',
            'local date helper must respect the device timezone');
          const context = {};
          vm.runInNewContext(fs.readFileSync('assets/js/state/reward-utils.js', 'utf8'), context);
          const quest = { id: 'habit-1' };
          // 23:30 UTC on Nov 9 is 00:30 local time on Nov 10 in Amsterdam.
          const ledger = [{ eventId: 'event-1', questId: 'habit-1', at: Date.UTC(2026, 10, 9, 23, 30), habit: true }];
          assert.equal(context.hasHabitRewardForDay(quest, ledger, '2026-11-10'), true,
            'late UTC event must count for the next local calendar day');
          assert.equal(context.hasHabitRewardForDay(quest, ledger, '2026-11-09'), false,
            'the UTC date must not be mistaken for the local reward day');
          assert.equal(context.hasHabitRewardForDay(quest, ledger, '2026-11-11'), false);
          assert.equal(context.hasHabitRewardForDay({ id: 'habit-1', lastHabitRewardDay: '2026-11-11' }, ledger, '2026-11-11'), true);
          assert.equal(context.hasHabitRewardForDay({ id: 'habit-2' }, ledger, '2026-11-10'), false);
          const streak = { habitStreak: 12, lastHabitDay: '2026-11-10', habitBest: 12 };
          context.recordHabitStreakUndo(streak, '2026-11-10');
          assert.equal(streak.habitStreak, 11);
          assert.equal(streak.lastHabitDay, null);
          context.applyHabitStreakCompletion(streak, '2026-11-10', '2026-11-09', true);
          assert.equal(streak.habitStreak, 12, 'same-day recheck must restore the previous streak');
          assert.equal(streak.lastHabitDay, '2026-11-10');
          assert.equal(streak.habitStreakUndoDay, undefined);
          const missed = { habitStreak: 12, lastHabitDay: '2026-11-10', habitBest: 12 };
          context.recordHabitStreakUndo(missed, '2026-11-10');
          context.applyHabitStreakCompletion(missed, '2026-11-11', '2026-11-10', false);
          assert.equal(missed.habitStreak, 1, 'an undone day must break the streak');
          assert.equal(missed.habitStreakUndoDay, undefined);
          const quests = fs.readFileSync('assets/js/05-quests-goals-directions.js', 'utf8');
          if (!/hasHabitRewardForDay\(q, state\.rewardLedger, todayKey\(\)\)/.test(quests)) {
            throw new Error('Quest completion must consult the daily reward ledger');
          }
          if (!/if \(rewardAlreadyGrantedToday\)[\s\S]*Привычка отмечена\. XP за сегодня уже начислен\./.test(quests)) {
            throw new Error('Repeated same-day habit completion must not issue another reward');
          }
          if (!/recordHabitStreakUndo\(q, todayKey\(\)\)/.test(quests) || !/applyHabitStreakCompletion\(/.test(quests)) {
            throw new Error('Quest handlers must use tested habit streak transition helpers');
          }
          console.log('Daily habit reward idempotency: OK');
          NODE

      - name: Validate inline event handlers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'assets/js/01-core.js',
            'assets/js/02-cloud-auth.js',
            'assets/js/03-state-and-systems.js',
            'assets/js/04-ai.js',
            'assets/js/05-quests-goals-directions.js',
            'assets/js/06-skills-lore-save.js',
            'assets/js/07-navigation-mentor.js',
            'assets/js/08-theme-init.js'
          ];
          const html = fs.readFileSync('index.html', 'utf8');
          const source = files.map(file => fs.readFileSync(file, 'utf8')).join('\n');
          const declared = new Set([...source.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(match => match[1]));
          const combined = html + '\n' + source;
          const calls = new Set();
          for (const match of combined.matchAll(/on(?:click|change|input|submit)\s*=\s*["']([^"']+)["']/g)) {
            for (const call of match[1].matchAll(/(?:^|[;{}]\s*)([A-Za-z_$][\w$]*)\s*\(/g)) {
