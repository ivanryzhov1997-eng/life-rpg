name: Deploy Supabase Auth app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supabase Auth app
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble static site
        run: |
          mkdir -p artifact/assets
          cp index.html artifact/index.html
          cp -a assets/css artifact/assets/
          cp -a assets/js artifact/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact

      - name: Deploy Supabase Auth app
        id: deployment
        uses: actions/deploy-pages@v4
