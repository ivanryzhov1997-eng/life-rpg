name: Import new RPG-LIFE app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-check
          fetch-depth: 0

      - name: Extract app
        run: |
          rm -rf app
          mkdir -p app
          unzip -q LIFE_RPG_anonymous_groq_checked.zip -d /tmp/rpg
          cp -R /tmp/rpg/app/. app/
          rm -rf /tmp/rpg

      - name: Remove archive
        run: rm LIFE_RPG_anonymous_groq_checked.zip

      - name: Commit imported app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app LIFE_RPG_anonymous_groq_checked.zip
          git commit -m "Import anonymous Groq RPG-LIFE app [skip ci]" || exit 0
          git push origin HEAD:mobile-check
